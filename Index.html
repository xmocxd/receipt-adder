<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      .progress-container { margin-bottom: 20px; }
      .progress-label { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
      .progress-bar-bg { background-color: #e0e0e0; border-radius: 4px; overflow: hidden; height: 22px; width: 100%; }
      .progress-bar { height: 100%; width: 0%; transition: width 0.4s ease-in-out; }
      #spendBar { background-color: #4caf50; }
      #weekBar { background-color: #2196F3; }


       body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: top;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: white;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 320px;
        text-align: center;
      }
      h2 {
        color: #333;
        font-size: 1.2rem;
        margin-bottom: 20px;
      }
      input[type="number"] {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 1rem;
        margin-bottom: 15px;
      }
      .options-container {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      .option-label {
        flex: 1;
        background: #f1f3f4;
        padding: 8px 5px;
        margin: 0 3px;
        border-radius: 4px;
        font-size: 0.85rem;
        cursor: pointer;
        user-select: none;
        border: 1px solid #dcdcdc;
        transition: all 0.2s ease;
      }
      .option-label input {
        display: none; /* Hide standard radio button */
      }
      .option-label input:checked + span {
        font-weight: bold;
        color: #1a73e8;
      }
      .option-label input:checked {
        /* handled via parent styling if needed, or via JS */
      }
      /* Active state highlight for tappable options */
      .option-label.selected {
        background: #e8f0fe;
        border-color: #1a73e8;
        color: #1a73e8;
        font-weight: bold;
      }
      button {
        background-color: #1a73e8;
        color: white;
        border: none;
        padding: 10px 15px;
        width: 100%;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background-color: #1557b0;
      }
      #message {
        margin-top: 15px;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>

    <div class="card">
      <h2>Add Receipt</h2>
      <form id="myForm" onsubmit="handleFormSubmit(event)">
        <input type="number" step="any" id="numberInput" name="numberInput" placeholder="Enter number..."   inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" required autofocus>
        
        <div class="options-container">
          <label class="option-label selected" onclick="selectOption(this)">
            <input type="radio" name="category" value="other" checked> Other
          </label>
          <label class="option-label" onclick="selectOption(this)">
            <input type="radio" name="category" value="GROCERY"> Grocery
          </label>
          <label class="option-label" onclick="selectOption(this)">
            <input type="radio" name="category" value="UBER"> Uber
          </label>
        </div>

        <button type="submit" id="submitBtn">Submit</button>
      </form>
      <div id="message"></div>

      
    <div class="progress-container">
      <div class="progress-label">
        <span>Spend Progress</span>
        <span id="spendText">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="spendBar" class="progress-bar"></div>
      </div>
    </div>

    <div class="progress-container">
      <div class="progress-label">
        <span>Week Progress</span>
        <span id="weekText">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="weekBar" class="progress-bar"></div>
      </div>
    </div>
    </div>



    <script>


      // 1. Fetch metrics automatically when the page loads
      window.onload = function() {
        google.script.run
          .withSuccessHandler(updateUI)
          .withFailureHandler(handleError)
          .getMetrics();
      };

      function onFormSuccess(response) {
        // If the server returned an object with status and metrics, show status and update UI.
        if (response && typeof response === 'object') {
          if (response.status) {
            document.getElementById('message').style.color = 'green';
            document.getElementById('message').innerText = response.status;
          }
          updateUI(response);
        } else {
          // Otherwise just display the returned string
          document.getElementById('message').style.color = 'green';
          document.getElementById('message').innerText = response;
        }
      }

      function updateUI(data) {
        if (!data) return;

        // Handles whether the sheet returns decimals (0.45) or whole numbers (45)
        let spend = parseFloat(data.spendPercent) || 0;
        let week = parseFloat(data.weekPercent) || 0;

        let spendPct = spend <= 1 ? spend * 100 : spend;
        let weekPct = week <= 1 ? week * 100 : week;

        spendPct = Math.min(Math.max(spendPct, 0), 100).toFixed(1);
        weekPct = Math.min(Math.max(weekPct, 0), 100).toFixed(1);

        // Update Text
        document.getElementById('spendText').innerText = spendPct + '%';
        document.getElementById('weekText').innerText = weekPct + '%';

        // Update Bar Widths
        document.getElementById('spendBar').style.width = spendPct + '%';
        document.getElementById('weekBar').style.width = weekPct + '%';
      }

      function handleError(err) {
        document.getElementById('message').style.color = 'red';
        document.getElementById('message').innerText = "Error: " + err.message;
      }




       function selectOption(labelElement) {
        // Clear 'selected' class from all labels
        const labels = document.querySelectorAll('.option-label');
        labels.forEach(l => l.classList.remove('selected'));
        
        // Add 'selected' class to clicked label
        labelElement.classList.add('selected');
        
        // Check the radio input inside it
        const radio = labelElement.querySelector('input[type="radio"]');
        radio.checked = true;
      }

      function handleFormSubmit(event) {
        event.preventDefault(); // Prevent page refresh
        
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('message');
        btn.disabled = true;
        btn.innerText = "Submitting...";
        msg.innerText = "";
        
        google.script.run
          .withSuccessHandler(function(response) {
            // Accept either an object (with status + metrics) or a string
            if (response && typeof response === 'object') {
              msg.style.color = "#2e7d32";
              if (response.status) msg.innerText = response.status;
              updateUI(response);
            } else {
              msg.style.color = "#2e7d32";
              msg.innerText = response;
            }

            document.getElementById('myForm').reset();
            
            // Reset visual option selection back to 'Other' (default)
            const labels = document.querySelectorAll('.option-label');
            labels.forEach(l => l.classList.remove('selected'));
            labels[0].classList.add('selected'); // 'Other' is first
            
            btn.disabled = false;
            btn.innerText = "Submit";
          })
          .withFailureHandler(function(error) {
            msg.style.color = "#c62828";
            msg.innerText = "Error: " + (error && error.message ? error.message : error);
            btn.disabled = false;
            btn.innerText = "Submit";
          })
          .processForm(document.getElementById('myForm'));
      }
    </script>
  </body>
</html>
