<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: top;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: white;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 320px;
        text-align: center;
      }
      h2 {
        color: #333;
        font-size: 1.2rem;
        margin-bottom: 20px;
      }
      input[type="number"] {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 1rem;
        margin-bottom: 15px;
      }
      .options-container {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      .option-label {
        flex: 1;
        background: #f1f3f4;
        padding: 8px 5px;
        margin: 0 3px;
        border-radius: 4px;
        font-size: 0.85rem;
        cursor: pointer;
        user-select: none;
        border: 1px solid #dcdcdc;
        transition: all 0.2s ease;
      }
      .option-label input {
        display: none; /* Hide standard radio button */
      }
      .option-label input:checked + span {
        font-weight: bold;
        color: #1a73e8;
      }
      .option-label input:checked {
        /* handled via parent styling if needed, or via JS */
      }
      /* Active state highlight for tappable options */
      .option-label.selected {
        background: #e8f0fe;
        border-color: #1a73e8;
        color: #1a73e8;
        font-weight: bold;
      }
      button {
        background-color: #1a73e8;
        color: white;
        border: none;
        padding: 10px 15px;
        width: 100%;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background-color: #1557b0;
      }
      #message {
        margin-top: 15px;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Add Receipt</h2>
      <form id="myForm" onsubmit="handleFormSubmit(event)">
        <input type="number" step="any" id="numberInput" name="numberInput" placeholder="Enter number..." required autofocus>
        
        <div class="options-container">
          <label class="option-label selected" onclick="selectOption(this)">
            <input type="radio" name="category" value="other" checked> Other
          </label>
          <label class="option-label" onclick="selectOption(this)">
            <input type="radio" name="category" value="GROCERY"> Grocery
          </label>
          <label class="option-label" onclick="selectOption(this)">
            <input type="radio" name="category" value="UBER"> Uber
          </label>
        </div>

        <button type="submit" id="submitBtn">Submit</button>
      </form>
      <div id="message"></div>
    </div>

    <script>
      function selectOption(labelElement) {
        // Clear 'selected' class from all labels
        const labels = document.querySelectorAll('.option-label');
        labels.forEach(l => l.classList.remove('selected'));
        
        // Add 'selected' class to clicked label
        labelElement.classList.add('selected');
        
        // Check the radio input inside it
        const radio = labelElement.querySelector('input[type="radio"]');
        radio.checked = true;
      }

      function handleFormSubmit(event) {
        event.preventDefault(); // Prevent page refresh
        
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('message');
        btn.disabled = true;
        btn.innerText = "Submitting...";
        msg.innerText = "";
        
        google.script.run
          .withSuccessHandler(function(responseString) {
            msg.style.color = "#2e7d32";
            msg.innerText = responseString;
            document.getElementById('myForm').reset();
            
            // Reset visual option selection back to 'Other' (default)
            const labels = document.querySelectorAll('.option-label');
            labels.forEach(l => l.classList.remove('selected'));
            labels[0].classList.add('selected'); // 'Other' is first
            
            btn.disabled = false;
            btn.innerText = "Submit";
          })
          .withFailureHandler(function(error) {
            msg.style.color = "#c62828";
            msg.innerText = "Error: " + error.message;
            btn.disabled = false;
            btn.innerText = "Submit";
          })
          .processForm(document.getElementById('myForm'));
      }
    </script>
  </body>
</html>
